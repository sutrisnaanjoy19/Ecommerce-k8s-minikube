apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-frontend-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: test.sushi
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: simple-frontend-stable-service # <-- IMPORTANT: Point to your stable service
            port:
              number: 8081
# argocd/test/canary-service.yaml

apiVersion: v1
kind: Service
metadata:
  name: simple-frontend-canary-service # This is the canary service name
  namespace: default
spec:
  ports:
    - port: 8081
      targetPort: 80
      protocol: TCP
      name: http
  # The 'selector' here is just an initial placeholder.
  # Argo Rollouts will manage and update this selector dynamically.
  selector:
    app: simple-frontend